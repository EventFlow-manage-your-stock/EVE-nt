<div class="form-group">
<textarea id="second-editor-note" name="details" rows="6">&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;Dzień dobry,&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;Dostałam kontakt do Pana od Pauliny Czajki, która była bardzo zadowolona ze współpracy z Państwem na targach KUBECON. Kontynuując tę dobrą passę, chciałabym poprosić o wycenę dla nowego projektu, który będziemy wykonywać na targach IFA w Berlinie. Mamy wcześniejszy montaż od 15 sierpnia.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;Proszę o wycenę następujących elementów:&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;ol&gt;&lt;li&gt;&lt;span style="font-size:12pt;"&gt;Ekran flex podwieszany 28 m x 2 m = 56 sqm&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;ol&gt;&lt;li&gt;&lt;span style="font-size:12pt;"&gt;Stojący led wall 6 m x 3 m = 18 sqm&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;ol&gt;&lt;li&gt;&lt;span style="font-size:12pt;"&gt;4 głośniki na quadro&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span style="font-size:12pt;"&gt;4 bezprzewodowe mikrofony&lt;/span&gt;&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;Załączam także wizualizację. W razie pytań proszę o kontakt.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);font-size:12pt;"&gt;06.08 - nowe informacje:&lt;/span&gt;&lt;/p&gt;&lt;p&gt;W nawiązaniu do rozmowy harmonogram budowy ekranów led po ustaleniach z prowadzącym budowę stoiska.&lt;/p&gt;&lt;p&gt;Ekran Led na podwieszeniu - 17.08 br.&lt;/p&gt;&lt;p&gt;Ekran Led na podłodze 21.08.br&lt;/p&gt;&lt;p&gt;W przypadku pytań&amp;nbsp; PM prowadzący Monika Młodnicka&amp;nbsp; &amp;nbsp;tel 781&amp;nbsp;986 611&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);"&gt;Proszę o przesłanie rozdzielczości obu ekranów, aby klient mógł odpowiednio przygotować swoje materiały.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);"&gt;Mam już informację od klienta: chcą mieć próbę z mikrofonami, ścianami LED i wszystkim podłączonym 3 września po południu. Czy możecie to uwzględnić w swoim harmonogramie? Będę wtedy potrzebowała 1-2 techników na stoisku.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);"&gt;Kolejna kwestia: klient chciałby, żeby filmy na obu ekranach były odgrywane jednocześnie. Czyli trzeba je w jakiś sposób połączyć, żeby prezentacja odgrywała się symultanicznie.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span style="color:rgb(10,47,65);"&gt;To dotyczy jedynie czasu poza konferencją. Podczas konferencji na ekranie stojącym prowadzący ma mieć możliwość zmieniania slajdów za pomocą clickera, a w tym samym czasie na podwieszanym ekranie ma grać inne video.&lt;/span&gt;&lt;br&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;</textarea> </div>
