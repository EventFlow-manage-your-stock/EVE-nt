<h3>  Opis </h3>
<div class="form-group">
<textarea id="first-editor-note" name="description" rows="6">&lt;p&gt;impreza dla SLS w bliżniaczej sali &lt;a href="https://pixel.stageteam.pl/valuations/single/item/3066"&gt;https://pixel.stageteam.pl/valuations/single/item/3066&lt;/a&gt;&amp;nbsp;&lt;/p&gt;</textarea> </div>
<h3>Szczegóły </h3>
<div class="form-group">
<textarea id="second-editor-note" name="details" rows="6">&lt;p&gt;Gala wręczenia nagród w Programie &lt;strong&gt;Przedsiębiorstwo Fair Play&lt;/strong&gt; jest planowana na 27 listopada 2026 roku w &lt;a href="https://pkin.pl/wynajem-powierzchni-eventowej/sale-w-pkin/sala-marmurowa/"&gt;Sali Marmurowej Pałacu Kultury i Nauki w Warszawie&lt;/a&gt;.&lt;br&gt;Wydarzenie jest planowane na ok. 300 osób w opcji zasiadanej przy okrągłych stołach (ok. 140-150 firm- laureatów), dwóch prowadzących i będzie połączone z występem tanecznym Stefano Terrazzino (Rider w załączeniu) oraz realizacją na żywo - wyświetlaną na diodach.&lt;/p&gt;&lt;p&gt;Załączam kilka zdjęć ilustrujących przebieg i oprawę gali (Gala z 2024 roku).&lt;a href="https://fairplay.pl/galeria-zdjec-z-wielkiej-gali-przedsiebiorstw-fair-play-2024"&gt;Więcej zdjęć&lt;/a&gt;&lt;/p&gt;&lt;p&gt;Przewidujemy w tym roku zmianę 1 ekranu głównego i 6 TV wyświetlających przebieg wręczeń na 3 ekrany diodowe - jeden główny większy niż w 2024 roku - 8,5 na 3 m oraz dwie diody pionowe zamieszczone na filarach 2x4 m - schemat w załączeniu (diody zazn. na zielono).&amp;nbsp;&lt;br&gt;Scena do wręczeń 8,5m x 4m na 60cm wysoka, 2 schodki szerokie na 4 m oraz schodki boczne.&lt;br&gt;Potrzebne jest (analogiczne jak na zdjęciach) pełne oświetlenie, nagłośnienie i realizacja w Sali Marmurowej + spełnienie ridera Stefano + oświetlenie boczne ścian w &lt;a href="https://pkin.pl/wynajem-powierzchni-eventowej/sale-w-pkin/sala-korczaka/"&gt;Sali Korczaka&lt;/a&gt;, bo chcemy tam umieścić 8 samodzielnych stoisk wystawowych naszych laureatów - które będą dostępne od godziny 16 do 20:00, a później sala będzie miejscem, gdzie będzie można porozmawiać, gdy będzie trwała cześć oficjalna.&lt;/p&gt;&lt;p&gt;Podczas wręczeń na Gali na diodzie wyświetlane są nasze prezentacje z logotypami laureatów, partnerów oraz krótkie animacje związane z prezentacją poszczególnych nagród. Wręczenia podobnie jak latach ubiegłych odbywać się będą przy muzyce DJ.a. Laureat wchodzi na scenę odbiera nagrodę z rąk komitetu gratulacyjnego (w tym czasie pojawia się zapowiedź nagrody, w tle na diodzie wyświetla się logo firmy i wybrzmiewa ustalony motyw muzyczny). Część wręczeń odbywać się będzie grupowo - województwami (na scenie będzie wtedy do 20 osób). Mamy co roku swoją profesjonalną obsługę fotograficzną, która wykonuje zdjęcia laureatom, dlatego potrzebne jest dobre oświetlenie osób odbierających nagrody. Wydarzenia nie będziemy transmitować na żywo, ale będzie nagrywana relacja wideo (w naszym zakresie).&lt;/p&gt;&lt;p&gt;Rozpoczęcie części oficjalnej imprezy planowane jest na godz. 17.00. Wręczenia i przemówienia potrwają do godz. 19:20. O 19:30 planujemy występ taneczny, a po nim zabawę przy muzyce DJ do 23:00.&lt;br&gt;Ekipa realizatorska ma czas na montaż w dniu imprezy od 00:00. Demontaż od godz. 23:00.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&amp;nbsp;&lt;/p&gt;</textarea> </div>
