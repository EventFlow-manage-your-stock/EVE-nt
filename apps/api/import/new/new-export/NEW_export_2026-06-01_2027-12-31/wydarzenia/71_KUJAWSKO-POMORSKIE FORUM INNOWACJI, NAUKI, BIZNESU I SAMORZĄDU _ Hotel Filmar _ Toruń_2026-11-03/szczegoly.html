<textarea id="second-editor-note" name="details" rows="6">&lt;p&gt;Dzień dobry,&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;bierzemy udział w przetargu na organizację konferencji &lt;strong&gt;&lt;u&gt;(4-5-6.11.2026)&lt;/u&gt;&lt;/strong&gt;, która wymaga oprawy multimedialnej.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;Poniżej przesyłam wytyczne – w przypadku dostępności Waszych usług proszę o wycenę &lt;strong&gt;&lt;u&gt;do jutra do godziny 14.00&lt;/u&gt;&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;I.&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;Zapewnienie obsługi multimedialnej wydarzenia pn. Forum Innowacji, Nauki, Biznesu i Samorządu (FINBiS’2026):&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;1.&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;Zaprojektowanie, wykonanie, dostarczenie/zainstalowanie zestawu urządzeń multimedialnych oraz koordynowaniu ich działania podczas wydarzenia w dniu 4, 5 oraz 6 listopada 2026 r. w jednej &lt;strong&gt;&lt;u&gt;Sali konferencyjnej (nr 1)&lt;/u&gt;&lt;/strong&gt;, w celu stworzenia oprawy audiowizualnej, zgodnie z programem ramowym konferencji, stanowiącym zał. nr 8 do SWZ.&lt;/p&gt;&lt;p&gt;Szczegółowy opis usługi:&lt;/p&gt;&lt;p&gt;1)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;OPRACOWANIE PROJEKTU OPRAWY MULTIMEDIALNEJ:&lt;/p&gt;&lt;p&gt;a)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;projekt sceny o szerokości (głębokości) 4 m i długości 10 m i wysokości podestu 60 cm z wykorzystaniem nowoczesnego ekranu LED o powierzchni 30 m2 wraz z pełnym systemem realizacji wizji umożliwiającym emisję animacji/grafik w rozdzielczości 4K i prezentacji prelegentów;&lt;/p&gt;&lt;p&gt;b)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;elementy scenografii zgodne z kolorystyką linii wizualnej wydarzenia i charakterem wydarzenia, określoną przez Zamawiającego.&lt;/p&gt;&lt;p&gt;2)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;DOSTARCZENIE I ZAINSTALOWANIE elementów, min. zgodnych z powyższymi punktami, ich montaż i demontaż:&lt;/p&gt;&lt;p&gt;a)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;ekran LED SMD P2,6 w min. rozdzielczości 384x384px na 1m2;&lt;/p&gt;&lt;p&gt;b)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;media Serwer z oprogramowaniem Vmix Pro, min. 4 wejścia HDSDI;&lt;/p&gt;&lt;p&gt;c)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;mikser wizji HD z min. ilością wejść/wyjść HD-SDI 4szt./ HDMI 2szt.;&lt;/p&gt;&lt;p&gt;d)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;pełne okablowanie sygnałowe oraz zasilające wraz z akcesoriami;&lt;/p&gt;&lt;p&gt;e)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;podest sceny głównej o ww. wymiarach, wyłożony wykładziną w kolorze czarnym;&lt;/p&gt;&lt;p&gt;f)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;monitor 70" przy punkcie rejestracji wydarzenia do wyświetlania filmów promocyjnych, logotypów, programu, etc.;&lt;/p&gt;&lt;p&gt;g)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;wyposażenie sceny głównej w 11 krzeseł do wszystkich paneli dyskusyjnych, zgodnie z programem szczegółowym udostępnionym przez Zamawiającego, w kolorystyce nawiązującej do linii wizualnej wydarzenia;&lt;/p&gt;&lt;p&gt;h)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;zapewnienie realizatora wizji oraz techników scenicznych, reżysera i kierownika produkcji.&lt;/p&gt;&lt;p&gt;3)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;OŚWIETLENIE SALI:&lt;/p&gt;&lt;p&gt;a)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;oświetl. frontowe, oświetlenie sceny oraz wybranych punktów architektury hotelowej;&lt;/p&gt;&lt;p&gt;4)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;NAGŁOŚNIENIE&lt;/p&gt;&lt;p&gt;a)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;nagłośnienie estradowe sali w systemie liniowym (+4 mikrofony do ręki i 2 nagłowne), cyfrowy mixer audio;&lt;/p&gt;&lt;p&gt;5)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;PRODUKCJA ANIMACJI/GRAFIK:&lt;/p&gt;&lt;p&gt;Wykonawca zapewni komplet animacji/grafik użytych do produkcji <textarea class="d-none form-control" id="second-editor-note-hidden" name="Event[details]" rows="6">&lt;p&gt;Dzień dobry,&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;bierzemy udział w przetargu na organizację konferencji &lt;strong&gt;&lt;u&gt;(4-5-6.11.2026)&lt;/u&gt;&lt;/strong&gt;, która wymaga oprawy multimedialnej.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;Poniżej przesyłam wytyczne – w przypadku dostępności Waszych usług proszę o wycenę &lt;strong&gt;&lt;u&gt;do jutra do godziny 14.00&lt;/u&gt;&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;I.&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;Zapewnienie obsługi multimedialnej wydarzenia pn. Forum Innowacji, Nauki, Biznesu i Samorządu (FINBiS’2026):&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;1.&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;Zaprojektowanie, wykonanie, dostarczenie/zainstalowanie zestawu urządzeń multimedialnych oraz koordynowaniu ich działania podczas wydarzenia w dniu 4, 5 oraz 6 listopada 2026 r. w jednej &lt;strong&gt;&lt;u&gt;Sali konferencyjnej (nr 1)&lt;/u&gt;&lt;/strong&gt;, w celu stworzenia oprawy audiowizualnej, zgodnie z programem ramowym konferencji, stanowiącym zał. nr 8 do SWZ.&lt;/p&gt;&lt;p&gt;Szczegółowy opis usługi:&lt;/p&gt;&lt;p&gt;1)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;OPRACOWANIE PROJEKTU OPRAWY MULTIMEDIALNEJ:&lt;/p&gt;&lt;p&gt;a)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;projekt sceny o szerokości (głębokości) 4 m i długości 10 m i wysokości podestu 60 cm z wykorzystaniem nowoczesnego ekranu LED o powierzchni 30 m2 wraz z pełnym systemem realizacji wizji umożliwiającym emisję animacji/grafik w rozdzielczości 4K i prezentacji prelegentów;&lt;/p&gt;&lt;p&gt;b)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;elementy scenografii zgodne z kolorystyką linii wizualnej wydarzenia i charakterem wydarzenia, określoną przez Zamawiającego.&lt;/p&gt;&lt;p&gt;2)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;DOSTARCZENIE I ZAINSTALOWANIE elementów, min. zgodnych z powyższymi punktami, ich montaż i demontaż:&lt;/p&gt;&lt;p&gt;a)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;ekran LED SMD P2,6 w min. rozdzielczości 384x384px na 1m2;&lt;/p&gt;&lt;p&gt;b)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;media Serwer z oprogramowaniem Vmix Pro, min. 4 wejścia HDSDI;&lt;/p&gt;&lt;p&gt;c)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;mikser wizji HD z min. ilością wejść/wyjść HD-SDI 4szt./ HDMI 2szt.;&lt;/p&gt;&lt;p&gt;d)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;pełne okablowanie sygnałowe oraz zasilające wraz z akcesoriami;&lt;/p&gt;&lt;p&gt;e)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;podest sceny głównej o ww. wymiarach, wyłożony wykładziną w kolorze czarnym;&lt;/p&gt;&lt;p&gt;f)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;monitor 70" przy punkcie rejestracji wydarzenia do wyświetlania filmów promocyjnych, logotypów, programu, etc.;&lt;/p&gt;&lt;p&gt;g)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;wyposażenie sceny głównej w 11 krzeseł do wszystkich paneli dyskusyjnych, zgodnie z programem szczegółowym udostępnionym przez Zamawiającego, w kolorystyce nawiązującej do linii wizualnej wydarzenia;&lt;/p&gt;&lt;p&gt;h)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;zapewnienie realizatora wizji oraz techników scenicznych, reżysera i kierownika produkcji.&lt;/p&gt;&lt;p&gt;3)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;OŚWIETLENIE SALI:&lt;/p&gt;&lt;p&gt;a)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;oświetl. frontowe, oświetlenie sceny oraz wybranych punktów architektury hotelowej;&lt;/p&gt;&lt;p&gt;4)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;NAGŁOŚNIENIE&lt;/p&gt;&lt;p&gt;a)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;nagłośnienie estradowe sali w systemie liniowym (+4 mikrofony do ręki i 2 nagłowne), cyfrowy mixer audio;&lt;/p&gt;&lt;p&gt;5)&lt;span style="font-family:&amp;quot;Times New Roman&amp;quot;;font-size:7pt;"&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp; &lt;/span&gt;PRODUKCJA ANIMACJI/GRAFIK:&lt;/p&gt;&lt;p&gt;Wykonawca zapewni ko
