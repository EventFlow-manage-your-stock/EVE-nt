<textarea id="first-editor-note" name="description" rows="6">&lt;p&gt;Montaż w środę 5.08 6-8.08 gra, demontaż 9.08 w niedzielę&lt;/p&gt;&lt;p&gt;W hali nocnego targu (gdzie rezydujemy ze światłem i dźwiękiem) w przyszłym tygodniu odbędzie się festiwal Members Only&lt;/p&gt;&lt;p&gt;Czwartek, piątek i sobota.&lt;/p&gt;&lt;p&gt;Próby od około godz. 11.00&lt;/p&gt;&lt;p&gt;Koncerty od około 17.00&lt;/p&gt;&lt;p&gt;Harmonogram w załączeniu.&lt;/p&gt;&lt;p&gt;Do ustawienia jest dioda o wymiarach około 5x3m ZA SCENĄ na konstrukcji stojącej.&lt;/p&gt;&lt;p&gt;Częściowo diodę będą zasłaniały maski i matryca z ledrotorów,które wiszą na tylnej kresce, ale klient ma tego świadomość.&lt;/p&gt;&lt;p&gt;Scena ma wymiary 8 × 6 m i wysokość około 1 m. Kratownica znajduje się na wysokości około 6 m.&lt;/p&gt;&lt;p&gt;Dodatkowo w Waszym zakresie byłoby wypuszczanie wizualizacji przygotowanych i dostarczonych przez klienta w kolejności koncertowej każdego dnia.&lt;/p&gt;&lt;p&gt;Dostępne jest gniazdo 32A do wyłącznej dyspozycji, a montaż i demontaż może się odbyć w dowolnym momencie (jednak nie w sobotę po zakończeniu wydarzenia, ponieważ po koncertach odbywa się tam regularna impreza do godziny 5.00 )&lt;/p&gt;</textarea> </div>
