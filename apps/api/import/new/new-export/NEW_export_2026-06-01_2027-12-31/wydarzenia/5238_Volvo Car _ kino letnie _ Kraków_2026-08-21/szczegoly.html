<textarea id="second-editor-note" name="details" rows="6">&lt;p&gt;Dzień dobry,&lt;/p&gt;&lt;p&gt;zwracam się z zapytaniem o przygotowanie oferty na kompleksową obsługę techniczną oraz aranżację strefy widza podczas planowanego wydarzenia kina letniego. Planujemy w dniu 21.08 dwie emisje – dla dzieci koło godz. 18 i dla dorosłych koło godz. 21.&lt;/p&gt;&lt;p&gt;Wydarzenie odbędzie się na terenie salonu Volvo Car PGD Kraków przy ul. Powstańców Śląskich 22 w Krakowie. Licencję oraz materiał filmowy posiadamy we własnym zakresie - z Państwa strony zależy nam na zapewnieniu najwyższej jakości oprawy sprzętowej – ekran, projektor, nagłośnienie, leżaki, ew. przekąski – popcorn.&lt;/p&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Zakres zapytania obejmuje:&lt;/strong&gt;&lt;/p&gt;&lt;ol&gt;&lt;li&gt;&lt;strong&gt;Ekran oraz projektor:&lt;/strong&gt; dobór profesjonalnego ekranu plenerowego oraz projektora o wysokiej jasności i rozdzielczości, dostosowanych do warunków zewnętrznych oraz specyfiki przestrzeni dealerstwa.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Nagłośnienie:&lt;/strong&gt; odpowiednio zbalansowany system audio zapewniający czysty dźwięk.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Strefa widza:&lt;/strong&gt; dostarczenie oraz rozstawienie wygodnych miejsc do siedzenia (leżaki, poduszki / pufy) dla ok. 50–80 osób + poczęstunku jeśli mają Państwo w ofercie.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Obsługa techniczna:&lt;/strong&gt; montaż, demontaż oraz nadzór techniczny nad przebiegiem projekcji.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;p&gt;Proszę o informację dotyczącą dostępności terminów w najbliższym okresie oraz szacunkowej wyceny realizacji takiego wydarzenia.&lt;/p&gt;&lt;p&gt;Będę wdzięczna za przesłanie specyfikacji proponowanego sprzętu oraz możliwych wariantów konfiguracji strefy siedzącej.&lt;/p&gt;</textarea> </div>
