version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: wms_postgres
    environment:
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: wms_event_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: